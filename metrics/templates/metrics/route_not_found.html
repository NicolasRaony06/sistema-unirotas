{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota não encontrada - UniRota</title>
    <link rel="stylesheet" href="{% static 'styles/route_not_found.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-container">
        <header class="header-with-back">
            <a href="{% url 'metrics:dashboard' %}" class="back-button">
                <i class="fa-solid fa-arrow-left" style="color: #0047ab;"></i>
            </a>
            <h1>Rota não encontrada</h1>
        </header>

        <div class="error-content">
            <div class="error-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2>Rota "{{ route_name }}" não existe</h2>
            <p>Esta rota não foi registrada em nenhum dia.</p>
            <div class="action-buttons">
                <a href="{% url 'metrics:all_routes' %}" class="btn">
                    <i class="fa-solid fa-list"></i>
                    Ver todas as rotas
                </a>
                <a href="{% url 'metrics:dashboard' %}" class="btn-primary">
                    <i class="fa-solid fa-chart-simple"></i>
                    Ver dashboard
                </a>
            </div>
        </div>
    </div>
</body>
</html>
