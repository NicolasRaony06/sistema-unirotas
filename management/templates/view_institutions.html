<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template view institutions teste</title>
</head>
<body>
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message.tags">{{message}}</div>
            {% endfor %}
        </div>
    {% endif %}
    <form action="{% url "management:view_institutions" %}" method="get">
        <label for="ocult_related_cities">Ocultar Cidades relacionadas</label>
        <input type="checkbox" name="ocult_related_cities" id="ocult_related_cities" value="True" {% if request.GET.ocult_related_cities %} checked {% endif %}>
        <button type="submit">Filtrar</button>
    </form>
    <br>
    {% if institutions %}
        <table>
            <tbody>
                <tr>
                    <th>Nome</th>
                    <th>Cidade</th>
                </tr>
                {% for institution in institutions %}
                    <tr>
                        <td>{{institution.name}}</td>
                        <td>{{institution.city}}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Não há instituições cadastradas</p>
    {% endif %}
</body>
</html>
