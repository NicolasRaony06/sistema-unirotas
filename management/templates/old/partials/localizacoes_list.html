<div class="main-column">

    <section class="panel municipios-panel">
        <div class="panel-head border-bottom-none">
            <div class="head-title">
                <h3>Localizações</h3>
                <span class="badge-count">{{total_municipios}} registros</span>
            </div>
            <div class="head-actions">
                <div class="search-box">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.35-4.35" />
                        </svg>
                    </span>
                    <input type="text" placeholder="Pesquisar">
                </div>
                <button type="button" class="btn-filter">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
                        </svg>
                    </span>
                    Filtrar

                    <a href="">
                        <button type="button" class="btn-primary">+ Nova Localização</button>
                    </a>
            </div>
        </div>

        <div class="municipios-list">

            {% for municipio in municipios %}

            <article class="municipio-card">
                <div class="municipio-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M21 5.5v14h2V21H1v-1.5h2V4.32l3.75-2.19l3.75 2.19V12h3V5.5zM19.5 7H15v5h3v7.5h1.5zm-9 6.5v6h6v-6zM6.75 3.87L4.5 5.18V19.5H9V5.18zM6 9V7h1.5v2zm0 1.5v2h1.5v-2zM6 16v-2h1.5v2zm12-7.5h-1.5v2H18zm-6 8V15h3v1.5z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="municipio-info">
                    <div class="code-status">
                        <span class="code">{{municipio.codigo_ibge}}</span>

                    </div>
                    <h4 class="name">{{municipio.nome}}</h4>
                    <p class="details">4 Paradas · 2 Instituições </p>
                </div>
                <div class="municipio-actions">
                    <button type="button" class="btn-action">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9" />
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                        </svg>
                        Editar
                    </button>
                    <form action="{% url 'management:retirar-municipio' municipio.id %}" method='Post'">
                        {% csrf_token %}
                    <button type="submit" class="btn-icon-only" aria-label="Pausar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="currentColor"
                                d="M6 7H5v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7zm10.618-3L15 2H9L7.382 4H3v2h18V4z" />
                        </svg>

                    </button>
                    </form>
                </div>
            </article>
            {% empty %}
            <p class="empty-message">Nenhuma localização encontrada</p>
            {% endfor %}

        </div>

    </section>


</div>
