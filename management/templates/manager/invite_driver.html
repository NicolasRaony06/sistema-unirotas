{% comment %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template teste</title>
</head>

<body>
    <!-- Template para teste de envio de convite de motorista por Manahger -->
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="message.tags">{{message}}</div>
        {% endfor %}
    </div>
    {% endif %}
    <form action="{% url " management:invite_driver" %}" method="post">
        {% csrf_token %}
        <label for="email">Email</label>
        <input type="email" name="email" id="email">
        <label for="confirm_email">Confirmar email</label>
        <input type="email" name="confirm_email" id="confirm_email">
        <button type="submit">enviar</button>
    </form>
</body>

</html> {% endcomment %}

{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convidar motorista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles/cadastro_municipio.css' %}">


</head>

<body>

    <div class="card">
        <div class="card-header">
            <h2>Convidar motorista</h2>
            <p>Insira o email do motorista</p>
        </div>
        <form action="{% url 'management:invite_driver' %}" method="post">


            {% csrf_token %}
            <div class="card-body">
                <!-- Nome do Município -->
                <div class="form-group">
                    <label class="form-label">
                        Email <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">

                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 36 36">
                                <path d="M0 0h36v36H0z" fill="none" />
                                <path fill="#004de6"
                                    d="M32 6H4a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h28a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2m-1.54 22H5.66l7-7.24l-1.44-1.39L4 26.84V9.52l12.43 12.37a2 2 0 0 0 2.82 0L32 9.21v17.5l-7.36-7.36l-1.41 1.41ZM5.31 8h25.07L17.84 20.47Z"
                                    class="clr-i-outline clr-i-outline-path-1" />
                                <path fill="none" d="M0 0h36v36H0z" />
                            </svg>
                        </div>

                        <input type="email" class="input-field" placeholder="motorista@example.com" name="email" />
                    </div>
                </div>

                <!-- Código IBGE -->
                <div class="form-group">
                    <label class="form-label">
                        Confirmar Email<span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 36 36">
                                <path d="M0 0h36v36H0z" fill="none" />
                                <path fill="#004de6"
                                    d="M32 6H4a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h28a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2m-1.54 22H5.66l7-7.24l-1.44-1.39L4 26.84V9.52l12.43 12.37a2 2 0 0 0 2.82 0L32 9.21v17.5l-7.36-7.36l-1.41 1.41ZM5.31 8h25.07L17.84 20.47Z"
                                    class="clr-i-outline clr-i-outline-path-1" />
                                <path fill="none" d="M0 0h36v36H0z" />
                            </svg>
                        </div>
                        <input type="email" class="input-field" placeholder="motorista@example.com"
                            name="confirm_email" />
                    </div>
                </div>
                <div class="button-group">
                    <a href="{% url 'management:view_drivers' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Enviar convite</button>
                </div>
            </div>
        </form>
    </div>

</body>

</html>
