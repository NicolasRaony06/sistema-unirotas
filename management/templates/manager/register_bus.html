{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Ônibus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles/cadastro_municipio.css' %}">


</head>

<body>
    <style>
        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            background-color: #ffffff;
            text-align: center;
            padding: 32px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 24px;
        }

        .upload-area:hover {
            border-color: #004de6;
        }

        .upload-area svg {
            margin-bottom: 12px;
        }

        .upload-area p {
            color: #004de6;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .upload-area span {
            color: #004de6;
            font-size: 11px;
            font-weight: 500;
        }

        .upload-input {
            display: none;
        }
    </style>
    <div class="card">
        <div class="card-header">
            <h2>Cadastrar Ônibus</h2>
            <p>Preencha os dados do novo veículo</p>
        </div>

        <form method="post" enctype="multipart/form-data" action="">

            {% csrf_token %}
            <div class="card-body">

                <!-- Nome do Ônibus -->
                <div class="form-group">

                    <label class="form-label">
                        Nome do ônibus <span class="required">*</span>
                    </label>

                    <div class="input-wrapper">

                        <div class="input-icon">

                            <svg style="color: #0d52d6;" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                                viewBox="0 0 24 24">
                                <path d="M0 0h24v24H0z" fill="none" />
                                <path fill="currentColor"
                                    d="M21.5 8H21V6c0-2.21-1.79-4-4-4H7C4.79 2 3 3.79 3 6v2h-.5c-.28 0-.5.22-.5.5v3c0 .28.22.5.5.5H3v6c0 .74.41 1.38 1 1.72v1.78c0 .28.22.5.5.5h2c.28 0 .5-.22.5-.5V20h10v1.5c0 .28.22.5.5.5h2c.28 0 .5-.22.5-.5v-1.78A2 2 0 0 0 21 18v-6h.5c.28 0 .5-.22.5-.5v-3c0-.28-.22-.5-.5-.5M19 18H5v-5h14zM5 11V8h6v3zm8 0V8h6v3zM7 4h10c1.1 0 2 .9 2 2H5c0-1.1.9-2 2-2" />
                                <path fill="currentColor"
                                    d="M7.5 14a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3m9 0a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3" />
                            </svg>


                        </div>

                        <input type="text" class="input-field" placeholder="Ex: Ônibus 001" name="name" />


                    </div>

                </div>


                <!-- Placa -->
                <div class="form-group">

                    <label class="form-label">
                        Placa <span class="required">*</span>
                    </label>

                    <div class="input-wrapper">

                        <div class="input-icon">

                            <svg style="color: #0d52d6;" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                                viewBox="0 0 24 24">
                                <path d="M0 0h24v24H0z" fill="none" />
                                <path fill="currentColor"
                                    d="M16.645 20H3.7a1.24 1.24 0 0 1-1.105-.67a1.26 1.26 0 0 1 .075-1.29L6.835 12l-4.16-6.04A1.249 1.249 0 0 1 3.7 4h12.94l5.025 7.29c.29.425.29.995 0 1.42L16.635 20zM4.18 18.5h11.675L20.34 12l-4.485-6.5H4.18L8.665 12z" />
                            </svg>

                        </div>

                        <input type="text" class="input-field" placeholder="Ex: ABC-1234" name="license_plate" />

                    </div>

                </div>


                <!-- Carga Máxima -->
                <div class="form-group">

                    <label class="form-label">
                        Carga Máxima <span class="required">*</span>
                    </label>

                    <div class="input-wrapper">

                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#004de6"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <circle cx="9" cy="7" r="4" />
                                <path d="M3 21v-2a6 6 0 0 1 12 0v2" />
                                <path d="M19 8v6" />
                                <path d="M16 11h6" />

                            </svg>
                        </div>

                        <input type="number" class="input-field" placeholder="Ex: 50" name="capacity" />

                    </div>

                </div>


                <!-- Cor -->
                <div class="form-group">

                    <label class="form-label">
                        Cor <span class="required">*</span>
                    </label>

                    <div class="input-wrapper">

                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#004de6"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <circle cx="12" cy="12" r="9" />
                                <circle cx="8" cy="9" r="1" />
                                <circle cx="16" cy="9" r="1" />
                                <circle cx="8" cy="15" r="1" />
                                <circle cx="16" cy="15" r="1" />

                            </svg>
                        </div>

                        <input type="text" class="input-field" placeholder="Cor" name="color">


                    </div>

                </div>


                <!-- Foto do Ônibus -->
                <div class="form-group">
                    <label class="form-label">Foto do Ônibus</label>
                    <label class="upload-area" for="{{ form.identification_photo.id_for_label }}">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#004de6" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M20.39 12.39A9 9 0 0 0 12 3a9 9 0 0 0-8.39 9.39 6 6 0 1 0 0 11.61h16.78a6 6 0 1 0 0-11.61z" />
                            <polyline points="16 12 12 8 8 12" />
                            <line x1="12" y1="8" x2="12" y2="20" />
                        </svg>
                        <p>Clique ou arraste uma imagem aqui</p>
                        <span>PNG, JPG até 5MB</span>

                        <!-- Injeção do Django aqui -->
                        <input type="file" class="upload-input" accept=".png, .jpg, .jpeg" name="identification_photo"
                            id="{{ form.identification_photo.id_for_label }}" />
                    </label>
                    {{ form.identification_photo.errors }}
                </div>


                <!-- Botões de Ação -->
                <div class="button-group">

                    <a href="{% url 'management:view_buses' %}" class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Adicionar ônibus
                    </button>

                </div>

            </div>

            {% if erro %}
            <p style="color: red; font-weight: bold; text-align: center;">
                {{ erro }}
            </p>
            {% endif %}

        </form>

    </div>

</body>

</html>
