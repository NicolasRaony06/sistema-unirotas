<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template teste</title>
</head>
<body>
    <!-- Template para teste de envio de convite de motorista por Manahger -->
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message.tags">{{message}}</div>
            {% endfor %}
        </div>
    {% endif %}
     <form action="{% url "management:invite_driver" %}" method="post">
        {% csrf_token %}
        <label for="email">Email</label>
        <input type="email" name="email" id="email">
        <label for="confirm_email">Confirmar email</label>
        <input type="email" name="confirm_email" id="confirm_email">
        <button type="submit">enviar</button>
     </form>
</body>
</html>
