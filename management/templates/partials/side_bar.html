{% load static %}

<aside class="sidebar">

    <div class="brand" aria-label="UniRota"> <!--LOGO-->
        <img src="{% static 'images/home/Logo.png' %}" alt="Logo">
    </div>

    <div class="profile">
        <div class="avatar">
            {% if profile_picture %} <!--Validação simples, se ouver ou não foto do usuario-->
            <img src="{{ profile_picture.url }}" alt="Imagem Usuario">
            {% else %}
            <img src="" alt="Imagem Usuario">
            {% endif %}
        </div>

        <div>
            <strong>{{full_name}}</strong>
            <span>{{role}}</span>
        </div>

        <span class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 20 20">
                <path d="M0 0h20v20H0z" fill="none" />
                <path fill="currentColor" d="m5 6l5 5l5-5l2 1l-7 7l-7-7z" />
            </svg>
        </span>
    </div>

    <nav class="nav" aria-label="Menu principal">
        <small>MENU</small>

        <a class="{% if request.resolver_match.url_name == 'home-admin' %}active{% endif %}" href="{% url 'management:home-admin' %}">
            <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            </span>
            Início
        </a>

        <a href="#notificacoes">
            <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
            </span>
            Notificações
            <i></i>
        </a>

        <a class="{% if request.resolver_match.url_name == 'gestores' %}active{%endif%}" href="{% url 'management:gestores' %}">
            <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
            </span>
            Gestores
        </a>

        <a class="{% if request.resolver_match.url_name == 'municipios' %}active{% endif %}"href="{% url 'management:municipios' %}">
            <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z" />
                    <circle cx="12" cy="10" r="2.5" />
                </svg>
            </span>
            Municípios
        </a>

        <a class="{% if request.resolver_match.url_name == '#configuracoes' %}active"{% endif %} href="#configuracoes">
            <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19 12a7 7 0 0 0-.2-1.6l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.8-1.6L13.5 2h-3l-.3 2.9a7 7 0 0 0-2.8 1.6l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .6.1 1.1.2 1.6l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.8 1.6l.3 2.9h3l.3-2.9a7 7 0 0 0 2.8-1.6l2.3 1 2-3.4-2-1.5c.1-.5.2-1 .2-1.6z" />
                </svg>
            </span>
            Configurações
        </a>

    </nav>
    
    <form method="post" action="{% url 'authentication:logout' %}" class="logout">
        {% csrf_token %}
        <button type="submit">

            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M18 12H9" />
                </svg>
            </span>
            Sair

        </button>
    </form>
</aside>
