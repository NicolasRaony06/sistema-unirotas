<!-- Conteúdo centralizado na main -->
    <div class="gestores-page-content">



        <!-- Painel: Lista de Gestores -->
        <section class="gestores-panel">
            <div class="panel-header">
                <div class="header-title">
                    <h3>Lista de Gestores</h3>
                    <span class="badge-count"> {{total_gestores}} registros</span>
                </div>

                <div class="header-actions">
                    <div class="search-box">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.35-4.35" />
                            </svg>
                        </span>
                        <input type="text" placeholder="Pesquisar">
                    </div>
                    <button type="button" class="btn-filter">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
                            </svg>
                        </span>
                        Filtrar
                    </button>
                    
                    <a href="">
                        <button type="button" class="btn-primary">+ Novo Gestor</button>
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Gestor</th>
                            <th>Contato</th>
                            <th>Status</th>
                            <th class="text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for gestor in gestores%}
                        <tr>
                            <td>
                                <span class="font-medium text-dark">{{ gestor.full_name }}</span>
                            </td>
                            <td>
                                {{ gestor.email }}{% if gestor.telefone %} · {{ gestor.telefone }}{% endif %}
                            </td>
                            <td>
                                <span class="status-badge {% if gestor.is_active %}active{% else %}inactive{% endif %}">
                                    {% if gestor.is_active %}Ativo{% else %}Inativo{% endif %}
                                </span>
                            </td>
                            <td class="text-right">
                                <div class="actions-cell">
                                    <a href="">
                                        <button type="button" class="btn-text">Ver mais</button>
                                    </a>
                                    <div class="action-icons">
                                        <button type="button" class="btn-icon" aria-label="Editar">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M12 20h9" />
                                                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                                            </svg>
                                        </button>
                                        <button type="button" class="btn-icon" aria-label="Pausar">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <rect x="6" y="4" width="4" height="16" />
                                                <rect x="14" y="4" width="4" height="16" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}

                    </tbody>
                </table>
            </div>


        </section>

    </div>
