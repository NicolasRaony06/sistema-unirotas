<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha</title>
</head>
<body>
    <div style="max-width: 400px; margin: 50px auto; padding: 20px;">
        <h2>Recuperação de Senha</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Enviar link de recuperação</button>
        </form>
        <p><a href="{% url 'authentication:login' %}">Voltar para o login</a></p>
    </div>
</body>
</html>
