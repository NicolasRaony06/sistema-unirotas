{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>{% block title %}{% endblock title %}</title>
    <link rel="stylesheet" href="{% static "styles/base.css" %}">

</head>
<body>
    {% block content %}{% endblock content %}

</body>
</html>
