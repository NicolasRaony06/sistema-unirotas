{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Início{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'operation/css/style.css' %}">
</head>
<body>
    <div class="app">
        <header class="topbar">
            {% block header %}{% endblock %}
        </header>

        <main class="content">
            {% if messages %}
                {% for message in messages %}
                    <p class="flash">{{ message }}</p>
                {% endfor %}
            {% endif %}

            {% block content %}{% endblock %}
        </main>

        <nav class="bottom-nav">
            <a href="{% url 'index_aluno' %}" class="{% block nav_inicio %}{% endblock %}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Início
            </a>
            <a href="{% url 'lista_linhas' %}" class="{% block nav_rotas %}{% endblock %}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M6 8v3a3 3 0 003 3h6a3 3 0 013 3v0"/></svg>
                Rotas
            </a>
            <a href="#" class="{% block nav_notificacoes %}{% endblock %}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a6 6 0 00-6 6v4l-2 4h16l-2-4V8a6 6 0 00-6-6z"/><path d="M9 19a3 3 0 006 0"/></svg>
                Notificações
            </a>
            <a href="{% url 'authentication:settings' %}" class="{% block nav_perfil %}{% endblock %}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 6-6 8-6s6.5 2 8 6"/></svg>
                Perfil
            </a>
        </nav>
    </div>
</body>
</html>
